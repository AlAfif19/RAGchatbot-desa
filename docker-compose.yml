services:
  mysql:
    image: mysql:8.4
    container_name: chatbot_warga_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: chatbot_warga
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: python:3.13-slim
    container_name: chatbot_warga_api
    working_dir: /app
    env_file:
      - .env
    command: sh -c "pip install -r apps/api/requirements.txt && cd apps/api && python -m alembic upgrade head && cd /app && python -m uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port 8000"
    depends_on:
      mysql:
        condition: service_healthy
      wa-connector:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  wa-connector:
    build:
      context: .
      dockerfile: apps/wa-connector/Dockerfile
    container_name: chatbot_warga_wa_connector
    environment:
      PORT: "3010"
      API_BASE_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      WA_SESSION_PATH: /app/apps/wa-connector/.wwebjs_auth
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
    ports:
      - "3010:3010"
    volumes:
      - wa_sessions:/app/apps/wa-connector/.wwebjs_auth

  web:
    image: node:22-alpine
    container_name: chatbot_warga_web
    working_dir: /app
    env_file:
      - .env
    command: sh -c "npm --prefix apps/web run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next

volumes:
  mysql_data:
  wa_sessions:
  web_node_modules:
  web_next:
